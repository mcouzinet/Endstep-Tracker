<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2016"/>
      <stop offset="1" stop-color="#0e0a07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d596"/>
      <stop offset="1" stop-color="#b8883d"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="#d4ae62" stroke-opacity=".35" stroke-width="3"/>
  <!-- the previous match, peeking out behind -->
  <rect x="46" y="24" width="52" height="76" rx="8" transform="rotate(11 72 62)" fill="#16110b" stroke="#d4ae62" stroke-opacity=".45" stroke-width="5"/>
  <!-- the current match: a card carrying its trend -->
  <g transform="rotate(-7 60 66)">
    <rect x="30" y="26" width="56" height="80" rx="9" fill="#1d160e" stroke="url(#gold)" stroke-width="6"/>
    <polyline points="41,85 52,71 61,77 75,55" fill="none" stroke="#f3d596" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="75" cy="55" r="6.5" fill="#f3d596"/>
  </g>
</svg>
