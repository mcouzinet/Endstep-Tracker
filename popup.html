<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endstep Tracker</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 360px; }
    /* On a phone the popup is a whole page or a sheet (Firefox for Android, Safari on iPhone): the screen's width. Read
       from the screen, not the pointer: an Android emulator says it has a mouse. */
    @media (max-device-width: 600px) { body { width: auto; } }
    body.loading main { visibility: hidden; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    header .mark { width: 17px; height: 21px; }
    header b { font-weight: 650; }
    main { display: grid; gap: 14px; padding: 14px; }
    h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 15px; font-weight: 650; }
    h2 .muted { font-weight: 400; font-size: 13px; }
    h3 { margin-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
    .arch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
    .stats dt { font-size: 12px; color: var(--ink-3); }
    .stats dd { margin: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .stats dd b { color: var(--ink); font-weight: 600; }
    .note { font-size: 13px; color: var(--ink-3); }
    .side { display: grid; gap: 2px; font-size: 13px; }
    .side .in { color: var(--win); } .side .out { color: var(--loss); } .side .muted { font-size: 12px; }
    ul { list-style: none; margin: 0; padding: 0; }
    .recent li { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid rgb(44 38 30 / .6); font-size: 13px; }
    .recent:first-child li:first-child { border-top: 0; } /* no session heading above it: only matches against the AI */
    .recent .who { min-width: 0; display: grid; }
    .recent .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent .score { font-weight: 600; font-variant-numeric: tabular-nums; }
    footer { display: grid; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
    footer .btn { justify-content: center; }
    .version { margin: 0; font-size: 11px; text-align: center; } /* which build is loaded, at a glance */
    .switch { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--gold); }
    .feedback { justify-self: start; font-size: 12px; color: var(--ink-3); }
    .access { display: grid; gap: 10px; margin: 12px 14px 0; padding: 10px 12px; border: 1px solid var(--danger); border-radius: var(--radius-sm); font-size: 13px; color: var(--ink-2); }
    .access b { color: var(--ink); }
  </style>
</head>
<body class="loading">
  <header>
    <svg class="mark" viewBox="0 0 64 80" aria-hidden="true"><g transform="rotate(-7 32 40)"><rect x="6" y="4" width="52" height="72" rx="8"/><polyline points="16,58 27,44 36,50 49,30"/></g></svg>
    <b>Endstep Tracker</b>
  </header>
  <div id="access" class="access" role="alert" hidden><p><b data-i18n="access_title"></b> <span data-i18n="access_text"></span></p><button id="access-btn" class="btn primary" data-i18n="access_btn"></button></div>
  <main id="main" aria-live="polite"></main>
  <footer>
    <button id="open" class="btn primary" data-i18n="open_dashboard"></button>
    <label class="switch"><input type="checkbox" id="overlay"><span data-i18n="overlay_toggle"></span></label>
    <a id="feedback" class="feedback" target="_blank" rel="noopener" data-i18n="feedback"></a>
    <p id="version" class="version muted"></p>
  </footer>
  <script src="tracker.js"></script>
  <script src="meta.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
